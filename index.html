<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pintor Plus - Redirecionando...</title>
  <meta http-equiv="refresh" content="0; url=/app.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div style="text-align: center; padding: 40px; font-family: 'Sora', sans-serif;">
    <p>Redirecionando para o aplicativo...</p>
    <div style="margin-top: 20px;">
      <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block;"></div>
    </div>
    <p style="margin-top: 20px; color: #64748b;">Se o redirecionamento não funcionar automaticamente, <a href="/app.html">clique aqui</a>.</p>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
