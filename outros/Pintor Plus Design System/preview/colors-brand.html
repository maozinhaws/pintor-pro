<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card-wrap">
  <div class="label" style="margin-bottom:12px;">Brand colors · light mode (after Lovable override)</div>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;">
    <div class="swatch" style="background:#ff6b35; height:96px;">
      <div class="meta"><span>--bl / --brand</span><span>#FF6B35</span></div>
    </div>
    <div class="swatch" style="background:#7b5cff; height:96px;">
      <div class="meta"><span>--brand-2</span><span>#7B5CFF</span></div>
    </div>
    <div class="swatch dark-text" style="background:#fff3e0; height:96px; border:1px solid #ececef;">
      <div class="meta" style="color:#92400E;"><span>--bll</span><span>#FFF3E0</span></div>
    </div>
    <div class="swatch" style="background:linear-gradient(135deg, #ff6b35 0%, #ff6b35 45%, #7b5cff 100%); height:96px;">
      <div class="meta"><span>--brand-gradient</span><span>3-stop, 45%</span></div>
    </div>
  </div>
  <div class="token" style="margin-top:10px; font-size:10px;">Note: in dark mode, --bl flips to #7B5CFF (purple). The logo identity stays purple in both modes.</div>
</div>
</body></html>
