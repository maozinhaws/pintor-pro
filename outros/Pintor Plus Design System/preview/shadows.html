<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<style>
  .float-card {
    background:#fff;
    height:96px;
    border-radius:20px;
    animation: float 3.4s ease-in-out infinite;
  }
  .float-card.delay-1 { animation-delay: -1.1s; }
  .float-card.delay-2 { animation-delay: -2.2s; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
</style>
</head>
<body style="padding:32px;">
<div class="card-wrap">
  <div class="label" style="margin-bottom:20px;">Shadow / elevation system · float ativo pra mostrar a profundidade</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px;">
    <div>
      <div class="float-card" style="box-shadow:0 8px 30px rgba(0,0,0,0.10);"></div>
      <div class="token" style="margin-top:10px;">--shadow-glass</div>
      <div class="token" style="font-size:9px;">0 8px 30px rgba(0,0,0,.10)</div>
    </div>
    <div>
      <div class="float-card delay-1" style="box-shadow:0 14px 40px rgba(0,0,0,0.18);"></div>
      <div class="token" style="margin-top:10px;">--shadow-strong</div>
      <div class="token" style="font-size:9px;">0 14px 40px rgba(0,0,0,.18)</div>
    </div>
    <div>
      <div class="float-card delay-2" style="background:linear-gradient(135deg,#ff6b35,#7b5cff); box-shadow:0 24px 56px -15px rgba(123,92,255,0.5);"></div>
      <div class="token" style="margin-top:10px;">--shadow-brand</div>
      <div class="token" style="font-size:9px;">0 24px 56px -15px purple/.5</div>
    </div>
  </div>
</div>
</body></html>
