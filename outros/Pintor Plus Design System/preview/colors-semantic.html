<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card-wrap">
  <div class="label" style="margin-bottom:12px;">Semantic accents · production token names</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
    <div class="swatch" style="background:#16a34a; height:96px;">
      <div class="meta"><span>--gn · success</span><span>#16A34A</span></div>
    </div>
    <div class="swatch" style="background:#F59E0B; height:96px;">
      <div class="meta" style="color:#fff;"><span>--am · amber / FAB</span><span>#F59E0B</span></div>
    </div>
    <div class="swatch" style="background:#ef4444; height:96px;">
      <div class="meta"><span>--rd · destructive</span><span>#EF4444</span></div>
    </div>
    <div class="swatch dark-text" style="background:#ECFDF5; height:64px; border:1px solid #ececef;">
      <div class="meta" style="color:#065F46;"><span>--gnl</span><span>#ECFDF5</span></div>
    </div>
    <div class="swatch dark-text" style="background:#FFFBEB; height:64px; border:1px solid #ececef;">
      <div class="meta" style="color:#92400E;"><span>--aml</span><span>#FFFBEB</span></div>
    </div>
    <div class="swatch dark-text" style="background:#FEF2F2; height:64px; border:1px solid #ececef;">
      <div class="meta" style="color:#ef4444;"><span>--rdl</span><span>#FEF2F2</span></div>
    </div>
  </div>
  <div class="token" style="margin-top:10px; font-size:10px;">Note: no --info semantic in production. Amber drives the FAB; green is reserved for "aprovado" status &amp; WhatsApp.</div>
</div>
</body></html>
