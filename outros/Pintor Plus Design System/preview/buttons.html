<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card-wrap">
  <div class="label" style="margin-bottom:14px;">Buttons</div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
    <button style="background:#0a0a0a;color:#fff;font-family:var(--font-body);font-weight:700;padding:12px 24px;border-radius:9999px;border:none;font-size:14px;cursor:pointer;">Criar Primeiro</button>
    <button style="background:#fff;color:#0a0a0a;font-family:var(--font-body);font-weight:600;padding:12px 20px;border-radius:9999px;border:1px solid #ececef;font-size:14px;cursor:pointer;">Cancelar</button>
    <button style="background:transparent;color:#0a0a0a;font-family:var(--font-body);font-weight:600;padding:12px 16px;border-radius:9999px;border:none;font-size:14px;cursor:pointer;">Ghost</button>
    <button style="background:#ef4444;color:#fff;font-family:var(--font-body);font-weight:700;padding:12px 24px;border-radius:9999px;border:none;font-size:14px;cursor:pointer;">Excluir</button>
  </div>
  <div style="display:flex; gap:12px; margin-top:12px; align-items:center;">
    <button style="background:#0a0a0a;color:#fff;font-family:var(--font-body);font-weight:700;padding:8px 16px;border-radius:9999px;border:none;font-size:12px;cursor:pointer;">sm</button>
    <button style="background:#0a0a0a;color:#fff;font-family:var(--font-body);font-weight:700;padding:12px 24px;border-radius:9999px;border:none;font-size:14px;cursor:pointer;">default</button>
    <button style="background:#0a0a0a;color:#fff;font-family:var(--font-body);font-weight:700;padding:16px 32px;border-radius:9999px;border:none;font-size:16px;cursor:pointer;">lg</button>
  </div>
</div>
</body></html>
