<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body style="padding:20px;">
<div class="card-wrap">
  <div class="label" style="margin-bottom:14px;">Wizard step pills · gradient ativo · borda visível light/dark</div>

  <!-- Light -->
  <div style="background:#f4f4f6; border-radius:14px; padding:18px 16px; margin-bottom:12px;">
    <div style="display:flex; gap:8px;">
      <div style="flex:1;height:8px;border-radius:9999px;background:linear-gradient(90deg,#ff6b35,#7b5cff);border:1px solid #9ca3af;"></div>
      <div style="flex:1;height:8px;border-radius:9999px;background:#ececef;border:1px solid #9ca3af;"></div>
      <div style="flex:1;height:8px;border-radius:9999px;background:#ececef;border:1px solid #9ca3af;"></div>
      <div style="flex:1;height:8px;border-radius:9999px;background:#ececef;border:1px solid #9ca3af;"></div>
    </div>
    <div class="token" style="margin-top:10px; font-size:10px;">light · borda #9ca3af em todas as steps (ativa e vazias)</div>
  </div>

  <!-- Dark -->
  <div style="background:#0b0d12; border-radius:14px; padding:18px 16px;">
    <div style="display:flex; gap:8px;">
      <div style="flex:1;height:8px;border-radius:9999px;background:linear-gradient(90deg,#ff6b35,#7b5cff);border:1px solid #4b5563;"></div>
      <div style="flex:1;height:8px;border-radius:9999px;background:#1c2027;border:1px solid #4b5563;"></div>
      <div style="flex:1;height:8px;border-radius:9999px;background:#1c2027;border:1px solid #4b5563;"></div>
      <div style="flex:1;height:8px;border-radius:9999px;background:#1c2027;border:1px solid #4b5563;"></div>
    </div>
    <div class="token" style="margin-top:10px; font-size:10px; color:#9ca3af;">dark · borda #4b5563 em todas as steps (ativa e vazias)</div>
  </div>
</div>
</body></html>
